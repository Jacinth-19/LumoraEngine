name: Build and Release LumoraEngine

on:
  push:
    branches: [ main, arena/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  VULKAN_SDK_VERSION: "1.3.275.0"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Cache Vulkan SDK
      id: cache-vulkan
      uses: actions/cache@v3
      with:
        path: C:\VulkanSDK
        key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-windows

    - name: Install Vulkan SDK
      if: steps.cache-vulkan.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $installer = "VulkanSDK-${env:VULKAN_SDK_VERSION}-Installer.exe"
        Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/${env:VULKAN_SDK_VERSION}/windows/${installer}" -OutFile $installer
        Start-Process -FilePath .\$installer -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
        Remove-Item $installer

    - name: Set Vulkan SDK environment
      shell: pwsh
      run: |
        echo "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_SDK_VERSION}" >> $env:GITHUB_ENV
        echo "C:\VulkanSDK\${env:VULKAN_SDK_VERSION}\Bin" >> $env:GITHUB_PATH

    - name: Cache CMake dependencies
      uses: actions/cache@v3
      with:
        path: |
          build/_deps
          ~/.cmake/packages
        key: cmake-deps-windows-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          cmake-deps-windows-

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
          -DLUMORA_BUILD_TESTS=OFF `
          -DLUMORA_BUILD_SAMPLES=ON `
          -DLUMORA_BUILD_EDITOR=ON `
          -DLUMORA_ENABLE_VALIDATION=OFF `
          -DLUMORA_ENABLE_PROFILING=ON

    - name: Build
      shell: pwsh
      run: cmake --build build --config ${{env.BUILD_TYPE}} --parallel

    - name: Package artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path artifacts -Force
        Copy-Item build/bin/${{env.BUILD_TYPE}}/*.exe artifacts/ -ErrorAction SilentlyContinue
        Copy-Item build/bin/${{env.BUILD_TYPE}}/*.dll artifacts/ -ErrorAction SilentlyContinue
        Copy-Item build/bin/${{env.BUILD_TYPE}}/*.pdb artifacts/ -ErrorAction SilentlyContinue
        if (Test-Path resources) { Copy-Item -Path resources -Destination artifacts/resources -Recurse }
        if (Test-Path shaders) { Copy-Item -Path shaders -Destination artifacts/shaders -Recurse }
        if (Test-Path samples) { Copy-Item -Path samples -Destination artifacts/samples -Recurse }

    - name: Create ZIP archive
      shell: pwsh
      run: Compress-Archive -Path artifacts/* -DestinationPath LumoraEngine-Windows-x64.zip

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: LumoraEngine-Windows-x64
        path: LumoraEngine-Windows-x64.zip
        retention-days: 90

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Cache Vulkan SDK
      id: cache-vulkan
      uses: actions/cache@v3
      with:
        path: ~/vulkan-sdk
        key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-linux

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libasound2-dev \
          libpulse-dev \
          libdbus-1-dev

    - name: Install Vulkan SDK
      if: steps.cache-vulkan.outputs.cache-hit != 'true'
      run: |
        wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
        sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
        sudo apt-get update
        sudo apt-get install -y vulkan-sdk

    - name: Cache CMake dependencies
      uses: actions/cache@v3
      with:
        path: |
          build/_deps
          ~/.cmake/packages
        key: cmake-deps-linux-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          cmake-deps-linux-

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DLUMORA_BUILD_TESTS=OFF \
          -DLUMORA_BUILD_SAMPLES=ON \
          -DLUMORA_BUILD_EDITOR=ON \
          -DLUMORA_ENABLE_VALIDATION=OFF \
          -DLUMORA_ENABLE_PROFILING=ON

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} --parallel

    - name: Package artifacts
      run: |
        mkdir -p artifacts
        cp -r build/bin/* artifacts/ 2>/dev/null || true
        cp -r build/lib/* artifacts/ 2>/dev/null || true
        [ -d resources ] && cp -r resources artifacts/ || true
        [ -d shaders ] && cp -r shaders artifacts/ || true
        [ -d samples ] && cp -r samples artifacts/ || true

    - name: Create TAR.GZ archive
      run: tar -czf LumoraEngine-Linux-x64.tar.gz -C artifacts .

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: LumoraEngine-Linux-x64
        path: LumoraEngine-Linux-x64.tar.gz
        retention-days: 90

  build-macos:
    name: Build macOS
    runs-on: macos-13
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Cache Vulkan SDK
      id: cache-vulkan
      uses: actions/cache@v3
      with:
        path: ~/VulkanSDK
        key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-macos

    - name: Install system dependencies
      run: |
        brew install cmake ninja

    - name: Install Vulkan SDK
      if: steps.cache-vulkan.outputs.cache-hit != 'true'
      run: |
        curl -o vulkansdk.dmg "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/mac/vulkansdk-macos-${VULKAN_SDK_VERSION}.dmg"
        hdiutil attach vulkansdk.dmg -mountpoint /Volumes/vulkansdk
        sudo /Volumes/vulkansdk/InstallVulkan.app/Contents/MacOS/InstallVulkan --accept-licenses --default-answer --confirm-command install
        hdiutil detach /Volumes/vulkansdk
        rm vulkansdk.dmg

    - name: Set Vulkan SDK environment
      run: |
        echo "VULKAN_SDK=$HOME/VulkanSDK/${VULKAN_SDK_VERSION}/macOS" >> $GITHUB_ENV
        echo "$HOME/VulkanSDK/${VULKAN_SDK_VERSION}/macOS/bin" >> $GITHUB_PATH

    - name: Cache CMake dependencies
      uses: actions/cache@v3
      with:
        path: |
          build/_deps
          ~/.cmake/packages
        key: cmake-deps-macos-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          cmake-deps-macos-

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DLUMORA_BUILD_TESTS=OFF \
          -DLUMORA_BUILD_SAMPLES=ON \
          -DLUMORA_BUILD_EDITOR=ON \
          -DLUMORA_ENABLE_VALIDATION=OFF \
          -DLUMORA_ENABLE_PROFILING=ON

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} --parallel

    - name: Package artifacts
      run: |
        mkdir -p artifacts
        cp -r build/bin/* artifacts/ 2>/dev/null || true
        cp -r build/lib/* artifacts/ 2>/dev/null || true
        [ -d resources ] && cp -r resources artifacts/ || true
        [ -d shaders ] && cp -r shaders artifacts/ || true
        [ -d samples ] && cp -r samples artifacts/ || true

    - name: Create TAR.GZ archive
      run: tar -czf LumoraEngine-macOS.tar.gz -C artifacts .

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: LumoraEngine-macOS
        path: LumoraEngine-macOS.tar.gz
        retention-days: 90

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          LumoraEngine-Windows-x64/LumoraEngine-Windows-x64.zip
          LumoraEngine-Linux-x64/LumoraEngine-Linux-x64.tar.gz
          LumoraEngine-macOS/LumoraEngine-macOS.tar.gz
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
